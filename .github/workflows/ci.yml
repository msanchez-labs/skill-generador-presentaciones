name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r presentador-html/requirements.txt
      - name: Instalar navegadores (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Instalar navegadores (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m playwright install chromium firefox webkit
      - name: Doctor
        run: python presentador-html/scripts/doctor.py
      - name: Construir y QA de ejemplos
        shell: bash
        run: |
          for d in presentador-html/examples/*/deck.json; do
            python presentador-html/scripts/build_deck.py "$d"
            python presentador-html/scripts/qa_deck.py "${d%.json}.html" --no-shots
          done
      - name: Pruebas del motor (Chromium, Firefox, WebKit)
        run: python -u tests/test_engine.py --browsers chromium,firefox,webkit
